<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail 客户端</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 授权界面 -->
    <div id="auth-screen" class="screen">
      <div class="auth-container">
        <div class="auth-card">
          <h1>📬 Gmail 客户端</h1>
          <p>请先进行 Google 账号授权以开始使用</p>
          <button id="auth-btn" class="btn btn-primary">🔐 授权 Gmail 访问</button>

          <div id="auth-waiting" class="hidden">
            <div class="auth-instructions">
              <h3>⏳ 等待授权中...</h3>
              <ol>
                <li>浏览器将在隐私模式下自动打开授权页面</li>
                <li>在浏览器中选择您的 Google 账号并授权</li>
                <li>授权成功后，浏览器会显示成功页面</li>
                <li>应用将自动完成登录，无需手动操作</li>
              </ol>
              <p class="hint">💡 提示：授权过程会在独立的隐私浏览器窗口中进行，不会保留任何浏览记录</p>
            </div>
          </div>

          <div id="auth-error" class="error hidden"></div>
        </div>
      </div>
    </div>

    <!-- 主界面 -->
    <div id="main-screen" class="screen hidden">
      <div class="header">
        <div class="header-left">
          <h1>📬 Gmail</h1>
          <div id="account-info" class="account-info"></div>
        </div>
        <div class="header-right">
          <button id="sync-btn" class="btn">🔄 同步</button>
          <button id="compose-btn" class="btn btn-primary">✉️ 写邮件</button>
          <button id="accounts-btn" class="btn">👤 账号</button>
        </div>
      </div>

      <div class="content">
        <!-- 邮件列表 -->
        <div class="mail-list">
          <div id="loading" class="loading hidden">加载中...</div>
          <div id="mail-list-container"></div>
        </div>

        <!-- 邮件详情 -->
        <div class="mail-detail">
          <div id="mail-detail-empty" class="empty-state">
            选择一封邮件查看详情
          </div>
          <div id="mail-detail-container" class="hidden">
            <div class="mail-detail-header">
              <h2 id="detail-subject"></h2>
              <div class="mail-actions">
                <button id="reply-btn" class="btn btn-sm">↩️ 回复</button>
                <button id="delete-btn" class="btn btn-sm btn-danger">🗑️ 删除</button>
              </div>
            </div>
            <div class="mail-meta">
              <div><strong>发件人：</strong> <span id="detail-from"></span></div>
              <div><strong>收件人：</strong> <span id="detail-to"></span></div>
              <div><strong>日期：</strong> <span id="detail-date"></span></div>
            </div>
            <div class="mail-body" id="detail-body"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 写邮件模态框 -->
    <div id="compose-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>✉️ 写邮件</h2>
          <button class="close-btn" data-close="compose-modal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="compose-to">📧 收件人</label>
            <input type="email" id="compose-to" placeholder="recipient@example.com" required>
          </div>
          <div class="form-group">
            <label for="compose-subject">📝 主题</label>
            <input type="text" id="compose-subject" placeholder="邮件主题" required>
          </div>
          <div class="form-group">
            <label for="compose-message">📄 内容</label>
            <textarea id="compose-message" rows="10" placeholder="请输入邮件内容..." required></textarea>
          </div>
          <div class="modal-footer">
            <button class="btn" data-close="compose-modal">取消</button>
            <button id="send-btn" class="btn btn-primary">📤 发送</button>
          </div>
          <div id="compose-error" class="error hidden"></div>
          <div id="compose-success" class="success hidden"></div>
        </div>
      </div>
    </div>

    <!-- 账号管理模态框 -->
    <div id="accounts-modal" class="modal hidden">
      <div class="modal-content modal-large">
        <div class="modal-header">
          <h2>👤 账号管理</h2>
          <button class="close-btn" data-close="accounts-modal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="accounts-toolbar">
            <button id="add-account-btn" class="btn btn-primary">➕ 添加账号</button>
            <button id="import-accounts-btn" class="btn">📥 导入</button>
            <button id="export-accounts-btn" class="btn">📤 导出</button>
          </div>

          <div id="accounts-list" class="accounts-list">
            <!-- 账号列表将动态生成 -->
          </div>

          <div id="accounts-error" class="error hidden"></div>
          <div id="accounts-success" class="success hidden"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
